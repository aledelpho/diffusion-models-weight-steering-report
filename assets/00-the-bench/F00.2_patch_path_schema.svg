<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where a patch can be lost between the widget and the weights</title>
  <desc id="d">A gain set in the interface passes through a name map and a patch applier before
    it reaches the model. It can be dropped silently at either step, and the run still
    completes and reports success.</desc>

  <style>
    .ink { fill:#ffffff; font-family:"DejaVu Sans",system-ui,sans-serif; }
    .in2 { fill:#c3c2b7; font-family:"DejaVu Sans",system-ui,sans-serif; }
    .mut { fill:#898781; font-family:"DejaVu Sans",system-ui,sans-serif; }
    .box { fill:none; stroke:#383835; stroke-width:1.5; }
    .arr { stroke:#57564f; stroke-width:1.8; fill:none; }
    .bad { stroke:#d03b3b; stroke-width:1.8; }
    .badf{ fill:#d03b3b; }
  </style>

  <rect x="0" y="0" width="880" height="340" fill="#1a1a19"/>

  <g transform="translate(792 20)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="none" stroke="#383835"/>
    <text class="mut" x="31" y="14" font-size="11" text-anchor="middle" letter-spacing="0.06em">schema</text>
  </g>
  <text class="ink" x="40" y="38" font-size="17" font-weight="700">Where a patch goes, and where it can vanish</text>

  <!-- catena -->
  <g>
    <rect class="box" x="40" y="86" width="170" height="58" rx="6"/>
    <text class="in2" x="125" y="111" font-size="13" text-anchor="middle">a gain you set</text>
    <text class="mut" x="125" y="130" font-size="11.5" text-anchor="middle">in the interface</text>
  </g>
  <path class="arr" d="M 210 115 L 268 115"/><path class="arr" d="M 262 110 L 270 115 L 262 120"/>

  <g>
    <rect class="box" x="270" y="86" width="170" height="58" rx="6"/>
    <text class="in2" x="355" y="111" font-size="13" text-anchor="middle">the name map</text>
    <text class="mut" x="355" y="130" font-size="11.5" text-anchor="middle">which tensors it means</text>
  </g>
  <path class="arr" d="M 440 115 L 498 115"/><path class="arr" d="M 492 110 L 500 115 L 492 120"/>

  <g>
    <rect class="box" x="500" y="86" width="170" height="58" rx="6"/>
    <text class="in2" x="585" y="111" font-size="13" text-anchor="middle">the patch applier</text>
    <text class="mut" x="585" y="130" font-size="11.5" text-anchor="middle">against the live model</text>
  </g>
  <path class="arr" d="M 670 115 L 728 115"/><path class="arr" d="M 722 110 L 730 115 L 722 120"/>

  <g>
    <rect class="box" x="730" y="86" width="110" height="58" rx="6"/>
    <text class="in2" x="785" y="119" font-size="13" text-anchor="middle">the weights</text>
  </g>

  <!-- i due punti di caduta -->
  <path class="bad" d="M 355 144 L 355 196" stroke-dasharray="5 4"/>
  <circle class="badf" cx="355" cy="200" r="5"/>
  <text class="badf" x="322" y="226" font-size="12.5" font-weight="700">it matches nothing</text>
  <text class="mut" x="322" y="244" font-size="11.5">a name that is not in the file,</text>
  <text class="mut" x="322" y="260" font-size="11.5">or a list written for another model</text>

  <path class="bad" d="M 585 144 L 585 196" stroke-dasharray="5 4"/>
  <circle class="badf" cx="585" cy="200" r="5"/>
  <text class="badf" x="552" y="226" font-size="12.5" font-weight="700">it is quietly dropped</text>
  <text class="mut" x="552" y="244" font-size="11.5">the key is not in the model as</text>
  <text class="mut" x="552" y="260" font-size="11.5">instantiated; only hits are counted</text>

  <line x1="40" y1="288" x2="840" y2="288" stroke="#2c2c2a" stroke-width="1"/>
  <text class="in2" x="40" y="312" font-size="12.5">At both points the run finishes, reports success, and produces an image that is exactly the baseline.</text>
  <text class="mut" x="40" y="330" font-size="12">Telling the two apart takes one number: how many patches the node actually accepted.</text>
</svg>
