<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Splitting a two-sided measurement into cost and steering</title>
  <desc id="d">Averaging the two directions gives the common mode, the cost; dividing them gives
    the swing, the steering. A ratio alone discards the first.</desc>

  <style>
    .s   { fill: #1a1a19; }
    .ink { fill: #ffffff; font-family: "DejaVu Sans", system-ui, sans-serif; }
    .in2 { fill: #c3c2b7; font-family: "DejaVu Sans", system-ui, sans-serif; }
    .mut { fill: #898781; font-family: "DejaVu Sans", system-ui, sans-serif; }
    .box { fill: none; stroke: #383835; stroke-width: 1.5; rx: 6; }
    .arr { stroke: #57564f; stroke-width: 1.6; fill: none; }
    .b1  { stroke: #3987e5; }
    .b2  { stroke: #d95926; }
    .f1  { fill: #3987e5; }
    .f2  { fill: #d95926; }
    .mono { font-family: "DejaVu Sans Mono", ui-monospace, monospace; }
  </style>

  <rect class="s" x="0" y="0" width="880" height="430"/>

  <!-- marca: questa figura spiega, non misura -->
  <g transform="translate(792 22)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="none" stroke="#383835" stroke-width="1"/>
    <text class="mut" x="31" y="14" font-size="11" text-anchor="middle" letter-spacing="0.06em">schema</text>
  </g>

  <text class="ink" x="40" y="38" font-size="17" font-weight="700">One push, two different things to measure</text>

  <!-- ingressi -->
  <g>
    <rect class="box" x="120" y="76" width="240" height="66"/>
    <text class="in2" x="240" y="103" font-size="13" text-anchor="middle">texture after pushing</text>
    <text class="f1 mono" x="240" y="126" font-size="17" text-anchor="middle" font-weight="700">+0.200</text>
  </g>
  <g>
    <rect class="box" x="520" y="76" width="240" height="66"/>
    <text class="in2" x="640" y="103" font-size="13" text-anchor="middle">texture after pushing</text>
    <text class="f2 mono" x="640" y="126" font-size="17" text-anchor="middle" font-weight="700">−0.200</text>
  </g>

  <!-- frecce verso il modo comune (si incrociano: entrambe alimentano la media) -->
  <path class="arr" d="M 240 142 C 240 200, 300 210, 360 244"/>
  <path class="arr" d="M 640 142 C 640 200, 580 210, 520 244"/>
  <!-- frecce verso lo swing -->
  <path class="arr" d="M 200 142 C 160 210, 140 250, 140 292"/>
  <path class="arr" d="M 680 142 C 720 210, 740 250, 740 292"/>

  <!-- uscita 1: il costo -->
  <g>
    <rect class="box" x="292" y="244" width="296" height="74" stroke="#57564f"/>
    <text class="ink mono" x="440" y="272" font-size="16" text-anchor="middle" font-weight="700">√( r⁺ · r⁻ )</text>
    <text class="in2" x="440" y="296" font-size="13" text-anchor="middle">the cost — what happens either way</text>
  </g>

  <!-- uscita 2: lo sterzo -->
  <g>
    <rect class="box" x="40" y="292" width="200" height="74" stroke="#57564f"/>
    <text class="ink mono" x="140" y="320" font-size="16" text-anchor="middle" font-weight="700">r⁺ / r⁻</text>
    <text class="in2" x="140" y="344" font-size="13" text-anchor="middle">the steering —</text>
    <text class="in2" x="140" y="360" font-size="13" text-anchor="middle">what the sign does</text>
  </g>
  <g>
    <rect class="box" x="640" y="292" width="200" height="74" stroke="#57564f" opacity="0.45"/>
    <text class="mut" x="740" y="322" font-size="13" text-anchor="middle">the same ratio,</text>
    <text class="mut" x="740" y="340" font-size="13" text-anchor="middle">on its own</text>
  </g>

  <!-- la perdita -->
  <path class="arr" d="M 440 318 L 440 382" stroke-dasharray="5 4"/>
  <text class="mut" x="452" y="392" font-size="12.5">a ratio on its own throws this half away — which is why the cost went unseen</text>
  <circle cx="440" cy="386" r="3.5" fill="#898781"/>
</svg>
