pending:

  # ---- asserted in the old ledger -------------------------------------------------

  - id: tiny-payload-shifts-mark-style
    claim: >
      A 53 KB hand-calibrated weight perturbation shifts the mark style of a 12.8-billion
      parameter diffusion model coherently and repeatably across seeds.
    source: "README@c843d61 §1.1"
    page: 01-mark-style

  - id: direction-not-distance
    claim: >
      This is not "the further from the checkpoint, the more the style changes". Controls at
      the same Frobenius displacement without the calibrated structure do not reproduce it.
    source: "README@c843d61 §1.1"
    page: 01-mark-style

  - id: clip-224-is-blind-to-it
    claim: >
      CLIP at 224x224 cannot see this change, because it downsamples before looking and the
      stroke detail does not survive. Measured on mark morphology the effect is solid.
    source: "README@c843d61 §1.2"
    page: 01-mark-style

  - id: mark-style-generalises
    claim: >
      The mark-style effect generalises beyond the prompt it was found on, on 24 prompts,
      against a generalisation criterion declared in advance.
    source: "README@c843d61 §1.3"
    page: 01-mark-style

  - id: colour-does-not-generalise
    claim: >
      The colour effect does not generalise: it is present only where the prompt pins the
      palette in detail, and vanishes when the model chooses the palette itself.
    source: "README@c843d61 §1.4"
    page: 01-mark-style

  - id: position-beats-displacement
    claim: >
      Where the edit lands changes how much the picture moves, and it is not a matter of how
      far the weights moved. The last four blocks move 28% less in Frobenius terms than blocks
      5-9 and change the image 3.7 times more.
    source: "README@c843d61 §4.1-§4.4"
    page: 04-where-in-the-model

  - id: preset-is-a-sharp-operator
    claim: >
      The hand-calibrated preset is a sharply defined operator, not a vague nudge: darker,
      greyer, grainier, parallel-stroked, headlights on. Five effects, one direction, two
      unrelated corpora.
    source: "README@c843d61 §1.6, §1.7, §2.8"
    page: 01-mark-style

  - id: bounded-to-one-model-one-corner
    claim: >
      Nothing here reaches outside Krea-2 or outside one narrow corner of image space. All 40
      prompts are upper-body or close-up character portraits and all 40 contain the phrases
      "bold ink outlines" and "hatched shadows".
    source: "README@c843d61, ledger"
    page: README / scope.md
    note: >
      This is the limit that bounds every result in the notebook. It belongs on the front
      page, not on one experiment page.

  - id: style-does-not-steer-direction
    claim: >
      That the direction of steering depends on the style the prompt declares. Tested with
      frozen thresholds and not supported.
    source: "README@c843d61, ledger; docs/stage9_verdict.md"
    page: 09-style-direction
    note: "Migrates as status overturned, typeset exactly like a page that holds."

  - id: position-function-or-proximity
    claim: >
      That the position effect is about function rather than about proximity to the output.
      CLIP-Dist measures how much the image moved, never what moved.
    source: "README@c843d61 §4.4"
    page: 04-where-in-the-model

  - id: block1-does-not-replicate
    claim: >
      That Block_1 shares the phenomenon. It looks like it does under rotation and does not
      replicate under amplitude scaling. Read as instability, not position.
    source: "README@c843d61 §4.3; docs/rotations_block1_vs_block6_results.md"
    page: 08-block1-vs-block6

  - id: exploratory-sizes-are-upper-bounds
    claim: >
      That an exploratory effect size in this notebook means anything. Three consecutive
      confirmation rounds came back between a third and a half of the exploratory estimate.
    source: "README@c843d61, ledger"
    page: README / scope.md

  - id: operative-structural-property-unknown
    claim: >
      Which structural property of the perturbation is the operative one. Two points separate
      structure from magnitude; they do not identify what about the structure does the work.
    source: "README@c843d61, ledger"
    page: 02-attribute-emergence or 01-mark-style
    note: >
      Stated on 02 inside "The controls" as a limitation, but not carried as a claim. Decide
      which page owns it before publishing it anywhere.

