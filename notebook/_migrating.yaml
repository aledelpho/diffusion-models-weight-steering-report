# _migrating.yaml -- the claims ledger of the migration.
#
# The old monolithic README carried its results as a prose bullet list under
# "What is established, and what is not" (git show c843d61:README.md, lines 245-389):
# twelve bullets asserted and eleven withheld, twenty-three in total. That list is the
# population this migration has to move, one claim at a time, into notebook/*.md.
#
# This file did not exist until 2026-09-21. The migration ran for two pages without it,
# which means nothing was checking that a claim had not been published twice, or dropped.
#
# THE RULE: when a claim is published on a page, delete its entry from `pending` and add a
# line to `migrated`. A claim must never be in both places.
#
# THE ARITHMETIC: `migrated` can grow past the number of bullets it consumed, because one
# bullet of the old ledger sometimes carries more than one testable statement and becomes
# several claims. An entry that came out of another carries `split_from`. The invariant is not
# len(migrated) + len(pending) == 23; it is that every one of the 23 bullets is either still in
# `pending` or named by the `id`, `was` or `split_from` of something in `migrated`.
#
# NOT YET ENFORCED. validate_notebook.py does not read this file. The check to add is:
# every id under `pending` must be absent from every page's claims[], and every id under
# `migrated` must resolve to a claim id that exists on the page it names. Until that check
# exists, this ledger is a promise rather than a control -- see AUTHORING.md, opening note.
#
# `source` is the section of the old README that carries the text and the evidence.

