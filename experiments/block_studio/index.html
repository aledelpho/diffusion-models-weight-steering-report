<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Studio</title>
<style>
  :root { --bg:#1a1a19; --panel:#222220; --raise:#2b2b28; --line:#33332f; --ink:#f2f1ec; --ink2:#c3c2b7;
          --muted:#898781; --acc:#3987e5; --neg:#d97a3a; --pos:#3aa0d9; --ok:#1aa06e; --bad:#d4583b; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
               font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 14px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.02em; }
  select, input, button { font:inherit; color:var(--ink); background:var(--raise); border:1px solid var(--line);
                          border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button:disabled { opacity:.35; cursor:default; border-color:var(--line); }
  #gen { background:var(--acc); border-color:var(--acc); font-weight:600; padding:6px 18px; }
  #status { color:var(--ink2); min-width:220px; } .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--muted); }
  main { display:grid; grid-template-columns:440px 1fr 170px; height:calc(100% - 54px); }
  #blocks { overflow-y:auto; border-right:1px solid var(--line); padding:6px 10px 30px; }
  .band { margin:14px 0 4px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .row { display:grid; grid-template-columns:44px 1fr 60px 22px 50px 50px; gap:6px; align-items:center;
         padding:3px 4px; border-radius:6px; }
  .row:hover { background:var(--panel); } .row.changed .name { color:var(--acc); font-weight:700; }
  .row.active { outline:1px solid var(--acc); }
  .name { font-variant-numeric:tabular-nums; color:var(--ink2); }
  .row input[type=range] { width:100%; accent-color:var(--acc); }
  .row input[type=number] { width:60px; padding:3px 4px; text-align:right; }
  .x { padding:0; width:22px; height:24px; color:var(--muted); background:none; border:none; }
  .ref { padding:2px 0; font-size:12px; } .ref.neg { color:var(--neg); } .ref.pos { color:var(--pos); }
  .ref.on.neg { background:var(--neg); color:#111; } .ref.on.pos { background:var(--pos); color:#111; }
  #viewer { display:flex; flex-direction:column; min-width:0; }
  #caption { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #caption .what { font-weight:600; } #caption .what.ref { color:var(--neg); }
  #guide { color:var(--ink2); padding:6px 14px; min-height:30px; border-bottom:1px solid var(--line); font-size:13px; }
  #stage { flex:1 1 0; display:flex; gap:10px; align-items:center; justify-content:center; padding:12px; min-height:0; overflow:hidden; }
  #stage figure { margin:0; height:100%; display:flex; flex-direction:column; align-items:center; min-width:0; }
  #stage figcaption { color:var(--muted); font-size:12px; margin-bottom:4px; }
  #stage img { max-width:100%; max-height:calc(100vh - 230px); object-fit:contain; border-radius:4px; background:#fff; }
  #stage .empty { color:var(--muted); }
  #history { overflow-y:auto; border-left:1px solid var(--line); padding:8px; }
  #history h2, .side h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:4px 0 8px; }
  .h { margin-bottom:10px; cursor:pointer; } .h img { width:100%; border-radius:3px; border:2px solid transparent; display:block; }
  .h.on img { border-color:var(--acc); } .h small { color:var(--muted); display:block; font-size:11px; }
  .h button { font-size:11px; padding:1px 6px; margin-top:2px; }
  .tools { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
  details summary { cursor:pointer; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-top:14px; }
</style>
</head>
<body>
<header>
  <h1>Block Studio</h1>
  <select id="char" title="character"></select>
  <select id="seed" title="seed"></select>
  <input id="seedCustom" type="number" placeholder="custom seed" style="width:120px">
  <select id="preset" title="start from a preset"></select><button id="loadPreset">Load</button>
  <button id="gen" title="Ctrl+Enter">Generate</button>
  <span id="status"><span class="dot" id="dot"></span> <span id="msg">connecting…</span></span>
</header>
<main>
  <section id="blocks">
    <div class="tools">
      <button id="resetAll">All to zero</button>
      <button id="copyVec">Copy vector</button>
      <button id="pasteVec">Paste vector…</button>
    </div>
    <div id="rows"></div>
    <details><summary>Text-encoder slots (28–33)</summary><div id="textrows"></div></details>
  </section>
  <section id="viewer">
    <div id="caption"><span class="what" id="what">—</span>
      <button id="showGen">Last generated</button><button id="showBase">Base</button><button id="showPreset">Comics preset</button>
      <label title="show the base of this character and seed beside whatever is on screen"><input type="checkbox" id="split"> side by side with base</label></div>
    <div id="guide"></div>
    <div id="stage"><span class="empty">Press Generate, or a − / + button to see what a block does at this seed.</span></div>
  </section>
  <aside id="history"><h2>History</h2><div id="hist"></div></aside>
</main>
<script>
const $ = s => document.querySelector(s);
let CFG = null, V = new Array(34).fill(0), HIST = [], viewing = null, activeRef = null, busy = false;
const store = { get(k, d) { try { const v = localStorage.getItem("bs_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("bs_" + k, JSON.stringify(v)); } catch (e) {} } };
const fmt = x => (x > 0 ? "+" : "") + x.toFixed(2);
const img = p => "/img?path=" + encodeURIComponent(p);
const seedNow = () => ($("#seedCustom").value ? $("#seedCustom").value.trim() : $("#seed").value);
const refsNow = () => ((CFG.refs[$("#char").value] || {})[seedNow()]) || null;

function msg(t, ok) { $("#msg").textContent = t; if (ok !== undefined) $("#dot").style.background = ok ? "var(--ok)" : "var(--bad)"; }

function row(i, label, band) {
  const b = CFG.blocks.find(x => x.index === i) || {};
  const r = document.createElement("div"); r.className = "row"; r.dataset.i = i;
  r.innerHTML = `<span class="name">${label}</span>
    <input type="range" min="-0.6" max="0.6" step="0.01">
    <input type="number" min="-0.99" max="0.99" step="0.01">
    <button class="x" title="reset">×</button>
    <button class="ref neg" data-s="-" title="what this block does pushed negative, at this seed">− ref</button>
    <button class="ref pos" data-s="+" title="what this block does pushed positive, at this seed">+ ref</button>`;
  const [rng, num] = r.querySelectorAll("input");
  const set = v => { v = Math.max(-0.99, Math.min(0.99, Math.round(v * 100) / 100 || 0)); V[i] = v; rng.value = v; num.value = v.toFixed(2);
                     r.classList.toggle("changed", v !== 0); store.set("V", V); };
  rng.oninput = () => set(+rng.value); num.onchange = () => set(+num.value); r.querySelector(".x").onclick = () => set(0);
  r._set = set;
  if (i < 28) r.querySelectorAll(".ref").forEach(btn => btn.onclick = () => showRef(i, btn.dataset.s, b));
  else r.querySelectorAll(".ref").forEach(btn => btn.remove());
  r.title = b.neg ? `negative: ${b.neg}\npositive: ${b.pos}\n(v4 doses ${b.doses})` : "";
  return r;
}

function build() {
  const rows = $("#rows"); rows.innerHTML = "";
  let band = null;
  CFG.blocks.forEach(b => {
    if (b.band !== band) { band = b.band; const h = document.createElement("div"); h.className = "band"; h.textContent = band; rows.appendChild(h); }
    rows.appendChild(row(b.index, "blk" + String(b.index).padStart(2, "0"), b.band));
  });
  const tr = $("#textrows"); tr.innerHTML = "";
  CFG.text_slots.forEach((n, k) => { const r = row(28 + k, String(28 + k), "text"); r.querySelector(".name").title = n; tr.appendChild(r); });
  V.forEach((v, i) => rowOf(i)._set(v));
  refreshRefs();
}
const rowOf = i => document.querySelector(`.row[data-i="${i}"]`);

function refreshRefs() {
  const R = refsNow();
  document.querySelectorAll(".row").forEach(r => {
    const i = +r.dataset.i;
    r.querySelectorAll(".ref").forEach(btn => {
      const k = R && R.blocks[i + btn.dataset.s];
      btn.disabled = !k; btn.textContent = (btn.dataset.s === "-" ? "− " : "+ ") + (k ? k.dose.toFixed(2) : "ref");
    });
  });
  $("#showBase").disabled = !(R && R.baseline); $("#showPreset").disabled = !(R && R.preset);
}

let lastShown = null;
function show(path, what, isRef, guideText) {
  lastShown = [path, what, isRef, guideText];
  const R = refsNow();
  const split = $("#split").checked && R && R.baseline && path && path !== R.baseline;
  $("#stage").innerHTML = !path ? `<span class="empty">nothing to show</span>`
    : split ? `<figure><figcaption>base</figcaption><img src="${img(R.baseline)}" alt=""></figure><figure><figcaption>${isRef ? "reference" : "generated"}</figcaption><img src="${img(path)}" alt=""></figure>`
    : `<img src="${img(path)}" alt="">`;
  $("#what").textContent = what; $("#what").className = "what" + (isRef ? " ref" : "");
  $("#guide").textContent = guideText || "";
}

function showRef(i, s, b) {
  const R = refsNow(); const k = R && R.blocks[i + s]; if (!k) return;
  if (activeRef === i + s) return showGenerated();
  activeRef = i + s;
  document.querySelectorAll(".ref").forEach(x => x.classList.remove("on")); document.querySelectorAll(".row").forEach(x => x.classList.remove("active"));
  rowOf(i).querySelector(s === "-" ? ".ref.neg" : ".ref.pos").classList.add("on"); rowOf(i).classList.add("active");
  show(k.path, `Reference — blk${String(i).padStart(2, "0")} ${s}${k.dose.toFixed(2)} alone · ${$("#char").selectedOptions[0].textContent} · seed ${seedNow()}`,
       true, (s === "-" ? "Guide, negative: " + (b.neg || "—") : "Guide, positive: " + (b.pos || "—")) + "   (click the button again, or Esc, to go back)");
}

function clearRef() { activeRef = null; document.querySelectorAll(".ref").forEach(x => x.classList.remove("on")); document.querySelectorAll(".row").forEach(x => x.classList.remove("active")); }

function showGenerated() {
  clearRef();
  const h = viewing !== null ? HIST[viewing] : HIST[0];
  if (!h) return show(null, "Nothing generated yet", false, "");
  show(h.path, `Generated — ${h.charName} · seed ${h.seed} · ${h.changed}`, false, "vector: " + h.vector.map(x => x.toFixed(2)).join(", "));
  renderHist();
}

function describe(vec) {
  const nz = vec.map((v, i) => [i, v]).filter(([, v]) => v !== 0);
  return nz.length ? nz.map(([i, v]) => (i < 28 ? "blk" + String(i).padStart(2, "0") : "t" + i) + " " + fmt(v)).join(", ") : "no edit";
}

function renderHist() {
  const el = $("#hist"); el.innerHTML = "";
  HIST.forEach((h, k) => {
    const d = document.createElement("div"); d.className = "h" + ((viewing === k || (viewing === null && k === 0)) && !activeRef ? " on" : "");
    d.innerHTML = `<img src="${img(h.path)}" alt=""><small>${h.charName} · ${h.seed}<br>${h.changed}</small><button>restore sliders</button>`;
    d.querySelector("img").onclick = () => { viewing = k; showGenerated(); };
    d.querySelector("button").onclick = e => { e.stopPropagation(); h.vector.forEach((v, i) => rowOf(i)._set(v)); msg("sliders restored from history"); };
    el.appendChild(d);
  });
}

async function generate() {
  if (busy) return; busy = true; $("#gen").disabled = true;
  const t0 = Date.now(); const vec = V.slice(); const char = $("#char").value; const seed = seedNow();
  try {
    msg("sending to ComfyUI…");
    const r = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ char, seed, vector: vec }) }).then(x => x.json());
    if (r.error) throw new Error(r.error);
    for (;;) {
      await new Promise(res => setTimeout(res, 700));
      const s = await fetch("/api/status?id=" + r.prompt_id).then(x => x.json());
      if (s.state === "done") {
        HIST.unshift({ path: s.path, vector: vec, seed, char, charName: $("#char").selectedOptions[0].textContent, changed: describe(vec) });
        HIST = HIST.slice(0, 60); store.set("HIST", HIST); viewing = null; showGenerated();
        msg(`done in ${((Date.now() - t0) / 1000).toFixed(1)} s`, true); break;
      }
      if (s.state === "error") throw new Error(s.error);
      msg(`${s.state}${s.ahead ? " (" + s.ahead + " ahead)" : ""} · ${((Date.now() - t0) / 1000).toFixed(0)} s`);
    }
  } catch (e) { msg("error: " + e.message, false); }
  busy = false; $("#gen").disabled = false;
}

async function init() {
  CFG = await fetch("/api/config").then(r => r.json());
  const groups = {};
  CFG.characters.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
  $("#char").innerHTML = Object.entries(groups).map(([g, cs]) => `<optgroup label="${g}">` + cs.map(c => `<option value="${c.id}">${c.name}</option>`).join("") + "</optgroup>").join("");
  $("#seed").innerHTML = Object.entries(CFG.seeds).map(([g, ss]) => `<optgroup label="${g}">` + ss.map(s => `<option>${s}</option>`).join("") + "</optgroup>").join("");
  $("#preset").innerHTML = CFG.presets.map((p, k) => `<option value="${k}">${p.name}</option>`).join("");
  $("#char").value = store.get("char", CFG.characters[0].id); $("#seed").value = store.get("seed", CFG.seeds[Object.keys(CFG.seeds)[0]][0]);
  $("#seedCustom").value = store.get("seedCustom", "");
  const saved = store.get("V", null); if (Array.isArray(saved) && saved.length === 34) V = saved.map(Number);
  HIST = store.get("HIST", []);
  build(); renderHist(); showGenerated();
  ["#char", "#seed", "#seedCustom"].forEach(s => $(s).addEventListener("change", () => {
    store.set("char", $("#char").value); store.set("seed", $("#seed").value); store.set("seedCustom", $("#seedCustom").value);
    refreshRefs(); if (activeRef) showGenerated();
  }));
  $("#loadPreset").onclick = () => { const p = CFG.presets[+$("#preset").value]; p.vector.forEach((v, i) => rowOf(i)._set(v)); msg("preset loaded: " + p.name); };
  $("#resetAll").onclick = () => V.forEach((_, i) => rowOf(i)._set(0));
  $("#copyVec").onclick = async () => { const t = V.map(x => x.toFixed(3)).join(", "); try { await navigator.clipboard.writeText(t); msg("vector copied"); } catch (e) { prompt("vectors_override:", t); } };
  $("#pasteVec").onclick = () => { const t = prompt("Paste a 34-value vectors_override:"); if (!t) return; const a = t.split(",").map(x => +x.trim());
                                   if (a.length !== 34 || a.some(isNaN)) return msg("not 34 numbers", false); a.forEach((v, i) => rowOf(i)._set(v)); };
  $("#gen").onclick = generate;
  $("#showGen").onclick = () => { viewing = null; showGenerated(); };
  $("#split").checked = store.get("split", false);
  $("#split").onchange = () => { store.set("split", $("#split").checked); if (lastShown) show(...lastShown); };
  $("#showBase").onclick = () => { const R = refsNow(); clearRef(); show(R.baseline, `Base (no edit) · seed ${seedNow()}`, true, "the bench's own baseline render"); };
  $("#showPreset").onclick = () => { const R = refsNow(); clearRef(); show(R.preset, `Comics preset (phase C render) · seed ${seedNow()}`, true, "the frozen preset, as rendered in C52"); };
  document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate(); if (e.key === "Escape") showGenerated(); });
  const p = await fetch("/api/ping").then(r => r.json()).catch(() => ({ comfy: false }));
  msg(p.comfy ? "ComfyUI connected" : "ComfyUI not reachable at 127.0.0.1:8188 — start it, then reload", !!p.comfy);
}
init();
</script>
</body>
</html>
