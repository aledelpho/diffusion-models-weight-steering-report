# Figure registry.
#
# Every figure referenced from a page under notebook/ has an entry here, and nothing is built
# that is not listed. See notebook/AUTHORING.md §4.
#
#   kind         scatter | strip | toggle | contact_sheet | ramp | diffmap | paired_bars | schema
#   builder      a function in experiments/notebook_figures.py (renders) or notebook_charts.py (charts)
#   source       the measurement file every number comes from; null only for kind: schema
#   caption_from source  -> the builder derives the caption from the row it is drawing
#                static  -> allowed for kind: schema only, which carries no measured number
#   crop         whole | locator:<name>     never a pixel rectangle
#   alt          the CLAIM the figure makes, not a description of its appearance
#   control      for kind: toggle — the companion toggle between two baselines at different
#                seeds, so the reader can see how far the image moves when nothing was touched

figures:

  # ---------------------------------------------------------------- 05-knob-or-cost

  - id: F05.1
    page: 05-knob-or-cost
    kind: scatter
    builder: notebook_charts.knob_vs_cost_scatter
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    color: sequential_by_block_index      # depth is ordered: one hue light->dark, not categorical
    direct_labels: [blk00, blk14, blk26, blk27]
    alt: >
      Twenty-eight blocks placed by how much they steer against how much they cost. The first
      block and the last few sit at opposite ends of the steering axis; the whole tail sits
      low on the cost axis.

  - id: F05.2
    page: 05-knob-or-cost
    kind: scatter
    builder: notebook_charts.depth_profile
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    color: sequential_by_block_index
    alt: >
      The common mode against block index for all 28 blocks, with the fitted line. The cost
      deepens steadily from the middle of the network toward the output.

  - id: F05.3
    page: 05-knob-or-cost
    kind: paired_bars
    builder: notebook_charts.rectification_bars
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    alt: >
      Per-block amplitude at plus 0.200 against minus 0.200, paired, both arms standardised
      on the same 18-seed noise estimate. Block 26 moves 9.1 times further in the positive
      direction; of the last six blocks only block 27 reverses it, and four blocks in the
      middle of the network reverse it too.

  # Built and looked at: the difference reads clearly at whole-frame size, so no crop.
  # The control is the same baseline twice, NOT two seeds — see AUTHORING §4.3.
  - id: F05.4
    page: 05-knob-or-cost
    kind: toggle
    builder: notebook_charts.inverted_knob_toggle
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    control: same_baseline_twice
    alt: >
      Block 0 and block 27, both pushed the same way, each alternating against its own
      baseline at the same seed. Block 0 comes out smoother and block 27 comes out etched
      all over; the control panel beside them, the same baseline twice, does not move.

  - id: F05.5
    page: 05-knob-or-cost
    kind: schema
    builder: null
    source: null
    caption_from: static
    crop: whole
    alt: >
      Schematic of the two components: averaging the two directions gives the common mode,
      the cost; dividing them gives the swing, the steering. A ratio alone discards the first.

