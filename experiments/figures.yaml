# Figure registry.
#
# Every figure referenced from a page under notebook/ has an entry here, and nothing is built
# that is not listed. See notebook/AUTHORING.md §4.
#
#   kind         scatter | strip | toggle | contact_sheet | ramp | diffmap | paired_bars | schema
#   builder      a function in experiments/notebook_figures.py (renders) or notebook_charts.py (charts)
#   source       the measurement file every number comes from; null only for kind: schema
#   caption_from source  -> the builder derives the caption from the row it is drawing
#                static  -> allowed for kind: schema only, which carries no measured number
#   crop         whole | locator:<name>     never a pixel rectangle
#   alt          the CLAIM the figure makes, not a description of its appearance
#   control      for kind: toggle — the companion toggle between two baselines at different
#                seeds, so the reader can see how far the image moves when nothing was touched

figures:

  # ---------------------------------------------------------------- 05-knob-or-cost

  - id: F05.1
    page: 05-knob-or-cost
    kind: scatter
    builder: knob_vs_cost_scatter
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    color: sequential_by_block_index      # depth is ordered: one hue light->dark, not categorical
    direct_labels: [blk00, blk14, blk26, blk27]
    alt: >
      Twenty-eight blocks placed by how much they steer against how much they cost. The first
      block and the last few sit at opposite ends of the steering axis; the whole tail sits
      low on the cost axis.

  - id: F05.2
    page: 05-knob-or-cost
    kind: scatter
    builder: depth_profile
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    color: sequential_by_block_index
    alt: >
      The common mode against block index for all 28 blocks, with the fitted line. The cost
      deepens steadily from the middle of the network toward the output.

  - id: F05.3
    page: 05-knob-or-cost
    kind: paired_bars
    builder: rectification_bars
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    alt: >
      Per-block amplitude at plus 0.200 against minus 0.200, paired, both arms standardised
      on the same 18-seed noise estimate. Block 26 moves 9.1 times further in the positive
      direction; block 27 is the only one that reverses this.

  # Built and looked at: the difference reads clearly at whole-frame size, so no crop.
  # The control is the same baseline twice, NOT two seeds — see AUTHORING §4.3.
  - id: F05.4
    page: 05-knob-or-cost
    kind: toggle
    builder: toggle_animation
    source: data/punto7_blocks.csv
    caption_from: source
    crop: whole
    control: same_baseline_twice
    alt: >
      Block 0 and block 27, both pushed the same way, each alternating against its own
      baseline at the same seed. Block 0 comes out smoother and block 27 comes out etched
      all over; the control panel beside them, the same baseline twice, does not move.

  - id: F05.5
    page: 05-knob-or-cost
    kind: schema
    builder: null
    source: null
    caption_from: static
    crop: whole
    alt: >
      Schematic of the two components: averaging the two directions gives the common mode,
      the cost; dividing them gives the swing, the steering. A ratio alone discards the first.

  # ---------------------------------------------------------------- 00-the-bench

  - id: F00.1
    page: 00-the-bench
    kind: toggle
    builder: toggle_animation
    source: data/bench_checks.csv
    caption_from: source
    crop: whole
    control: same_baseline_twice
    alt: >
      An edit and its exact inverse, alternating against the untouched baseline at the same
      seed. The weights are back at a displacement of zero and the image has not come back;
      the control panel beside it, the same baseline twice, does not move.

  - id: F00.2
    page: 00-the-bench
    kind: schema
    builder: null
    source: null
    caption_from: static
    crop: whole
    alt: >
      A patch passes from the interface through a name map and a patch applier before it
      reaches the weights, and can be dropped silently at either step while the run still
      finishes and reports success.

  - id: F00.3
    page: 00-the-bench
    kind: paired_bars
    builder: noise_floor_history
    source: data/bench_checks.csv
    caption_from: source
    crop: whole
    alt: >
      The seed-to-seed noise floor as it was estimated three times: 1.15 percent on three
      seeds, then 5.2 percent borrowed from other prompts, then 1.65 and 1.84 percent
      measured on eighteen seeds each.

  - id: F02.6
    page: 02-attribute-emergence
    kind: strip
    builder: notebook_charts.headlight_floor_by_style
    source: data/stage12_headlights_by_style.csv
    caption_from: source
    crop: whole
    direct_labels: [S03_cyberpunk]
    alt: >
      Per-style rate of lit headlights for the four conditions on the second corpus. Nine
      styles of ten never light one in any condition, so the registered confirmation had a
      single informative prompt and could not resolve anything.

  # ---------------------------------------------------------------- 03-what-ends-up-in-the-picture
  #
  # All three are charts built by notebook_charts.py from the derived tables, not from the
  # renders: the stage-12 renders live outside the repository. Two finished figures from this
  # round sit unregistered in assets/03_what_ends_up_in_the_picture/_figures because their
  # boxes and captions are typed into build_figures_stage12.py rather than read from the
  # annotation file -- pitfall 40, and the reason this page shows charts instead.

  - id: F03.1
    page: 03-what-ends-up-in-the-picture
    kind: strip
    builder: notebook_charts.enlargement_by_prompt
    source: data/stage12_enlargement_by_prompt.csv
    caption_from: source
    crop: whole
    direct_labels: [S04_gouache, S06_pastel]
    alt: >
      Per-prompt area ratio for the three conditions across ten new styles. The subject grows
      in nine styles of ten under block derangement at double dose, geometric mean 1.234,
      while the calibrated preset predicted to shrink it does nothing.

  - id: F03.2
    page: 03-what-ends-up-in-the-picture
    kind: paired_bars
    builder: notebook_charts.discrimination_rates
    source: data/stage12_pattern_results.json
    caption_from: source
    crop: whole
    alt: >
      Identification rate for each condition in a four-way forced choice, against the chance
      line. The calibrated preset was identified in 17 trials of 20 and the block derangement
      in 12 of 20, against a 25% chance level; both in the same trial in 12 of 20 against 8.3%.

  - id: F03.3
    page: 03-what-ends-up-in-the-picture
    kind: scatter
    builder: notebook_charts.discriminability_vs_effect
    source: data/stage12_enlargement_by_prompt.csv
    caption_from: source
    crop: whole
    direct_labels: [S04_gouache, S06_pastel]
    alt: >
      Per-style area ratio against how often the annotator identified that condition in the
      line-up. The mean ratio is 1.12 in the three styles never identified and 1.33 in the five
      always identified; the effect is smaller where the blinding held and it does not vanish.

  # ---------------------------------------------------------------- 06-the-hatching-axis
  #
  # Charts, not renders: the stage-7 images live outside the repository and the figures that
  # do exist for this experiment (assets/01_steering_stage7/_figures) were built in a light
  # theme, which AUTHORING section 4.4 requires regenerating rather than recolouring.

  - id: F06.1
    page: 06-the-hatching-axis
    kind: strip
    builder: notebook_charts.hatching_axis_by_prompt
    source: data/stage7_hatching_pairs.csv
    caption_from: source
    crop: whole
    alt: >
      One difference per prompt for the three families, seeds averaged first. The calibrated
      preset separates negative in all sixteen prompts, the block derangement positive in all
      sixteen, and the norm-matched sign scramble straddles zero.

  - id: F06.2
    page: 06-the-hatching-axis
    kind: strip
    builder: notebook_charts.hatching_axis_by_pair
    source: data/stage7_hatching_pairs.csv
    caption_from: source
    crop: whole
    alt: >
      Every seed-level pair for the three families. The preset separates in eighty pairs of
      eighty and the derangement in seventy-nine of eighty, with the single exception circled;
      the sign scramble spreads across zero.

  # ---------------------------------------------------------------- 01-mark-style

  - id: F01.1
    page: 01-mark-style
    kind: strip
    builder: scale_comparison
    source: data/stage7_manifest.csv
    caption_from: source
    crop: whole
    alt: >
      The same baseline and preset pair shown at full resolution and again at 224 by 224, the
      size CLIP actually looks at. The stroke detail that separates them does not survive the
      downsample.

  - id: F01.2
    page: 01-mark-style
    kind: toggle
    builder: toggle_gif
    source: data/stage7_manifest.csv
    caption_from: source
    crop: whole
    control: baseline_pair_seed42_seed777
    alt: >
      Baseline, preset and the norm-matched random control alternating on one prompt and one
      seed. The preset changes how the marks are drawn; the control at the same displacement
      does not.

  # ---------------------------------------------------------------- 02-attribute-emergence
  #
  # The headlight panels are the reason the crop rule exists (pitfall 40): five crop
  # rectangles of twenty did not contain the headlights they were captioned as showing.
  # Until a qualified locator exists, these are whole frames.

  - id: F02.1
    page: 02-attribute-emergence
    kind: contact_sheet
    builder: build_figures_headlights.grid
    source: data/stage9_headlights_raw.csv
    caption_from: source
    crop: whole
    alt: >
      Five seeds of one style, whole frames, the untouched model above and the edit below,
      each panel carrying its blind score. The untouched model lights no headlights in any of
      the five seeds; the edit lights them in all five.

  - id: F02.2
    page: 02-attribute-emergence
    kind: contact_sheet
    builder: build_figures_headlights.grid
    source: data/stage9_headlights_raw.csv
    caption_from: source
    crop: whole
    alt: >
      Five seeds of one style, whole frames, the untouched model above and the negative
      permutation below. The untouched model lights four of five; the edit lights none, and
      changes the whole scene while doing it.

  - id: F02.3
    page: 02-attribute-emergence
    kind: contact_sheet
    builder: build_figures_headlights.lightness_control
    source: data/stage9_headlights_pretreatment_strata.csv
    caption_from: source
    crop: whole
    alt: >
      Four scenes from the brightest third by the lightness of the untouched render, baseline
      above and the edit below, with the full stratified table. In the scenes where a
      dark-image explanation has nothing to work with, the untouched model lights one car in
      eleven and the edit lights seven in thirteen.

  # F02.4 and F02.5 are the first figures in the notebook built by the module the contract
  # names. Whole frames, twenty seeds, every caption read out of the scored manifest.
  - id: F02.4
    page: 02-attribute-emergence
    kind: contact_sheet
    builder: notebook_figures.barnacle_census
    source: data/attribute_emergence.csv
    caption_from: source
    crop: whole
    alt: >
      Twenty seeds, whole frames, block permutation above and the stock model below, each
      panel captioned with its recorded score. The permutation draws the requested attribute
      in nineteen seeds of twenty; the stock model draws it in one.

  - id: F02.5
    page: 02-attribute-emergence
    kind: contact_sheet
    builder: notebook_figures.barnacle_census
    source: data/attribute_emergence.csv
    caption_from: source
    crop: whole
    alt: >
      Twenty seeds, whole frames, block permutation above and the norm-matched sign scramble
      below, each panel captioned with its recorded score. At the identical displacement the
      scramble draws the attribute once in twenty, the same rate as the untouched model.

