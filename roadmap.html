<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project roadmap</title><style>
:root{--bg:#fafaf8;--panel:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e3e0;--acc:#3b5bdb;
--s-in:#e8590c;--s-wait:#ae3ec9;--s-open:#1c7ed6;--s-prop:#868e96;--s-done:#2f9e44;--s-wd:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141416;--panel:#1c1c1f;--ink:#ececee;--mut:#9a9aa2;--line:#2c2c31;--acc:#748ffc}}
:root[data-theme=dark]{--bg:#141416;--panel:#1c1c1f;--ink:#ececee;--mut:#9a9aa2;--line:#2c2c31;--acc:#748ffc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}h1{font-size:26px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.bar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
.bar button.on{border-color:var(--acc);color:var(--acc)}.bar input{flex:1;min-width:180px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}.meta{color:var(--mut);font-size:13px;margin-bottom:6px}.lab{font-weight:600}
code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 4px;word-break:break-all}
table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:24px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
</style></head><body><main>
<h1>Project roadmap</h1><p class="sub">Generated from <code>docs/roadmap_items.csv</code> and the results pages. Every cited file exists.</p>
<h2>Results pages</h2><div style="overflow-x:auto"><table id="pg"></table></div>
<h2>Experiments and tasks</h2><div class="bar" id="bar"></div><div id="list"></div>
<script>
const ITEMS=[{"id": "C79", "area": "Text encoder", "status": "in progress", "priority": "1", "title": "12-tap isolation: which taps carry the L06 / L14 damage", "state": "76/76 renders; 4/4 bit-exact gates (re-checked by Claude); encoder audit done; amendment 1 (taps are read before their layer, so L14's 'local' is one tap). By eye: local taps do almost nothing, neither half reproduces the full edit, both halves change the character.", "next": "Run --analyze on the GPU (directive ready); build the blind labelling page (section C, 108 items, questions in the positive); then decide the primary rule.", "files": "docs/prereg_te_tap_isolation.md;docs/te_tap_isolation_result.md;docs/directives_antigravity_te_tap_analyze.md;data/te_tap_isolation_encoder_summary.csv;data/te_tap_isolation_txtfusion_weights.csv"}, {"id": "PUB30", "area": "Publication", "status": "waiting for decision", "priority": "1", "title": "Page 30 and the Story: add C77, C78, the 36-layer probe and C79", "state": "The four results exist in docs/; none is on the public pages yet.", "next": "After Alessandro's approval of the claim wording: edit results/30-the-text-encoder.md and results/STORY.md, build, validate (0 errors), Antigravity publishes.", "files": "results/30-the-text-encoder.md;results/STORY.md"}, {"id": "APP2125", "area": "Publication", "status": "waiting for decision", "priority": "1", "title": "Pages 21 and 25: new claims from C48 and C66 (written by Argon, not committed)", "state": "Numbers match data/residual_probe_test.csv and data/metric_val_tests.csv; causal sentences toned down by Claude on 2026-10-18. Claim statuses need Alessandro's approval.", "next": "Approve or edit; then commit with the pages.", "files": "results/21-block-map.md;results/25-standard-metrics.md;docs/residual_probe_result.md;docs/metric_validation_result.md"}, {"id": "C78N", "area": "Text encoder", "status": "open", "priority": "2", "title": "C78 natural prompts: blind labels on the dwarf and the elf in five versions", "state": "Seen by eye only: no punctuation turns the dwarf's steel gorget brass (2 of 4 seeds); BREAK turns the elf's silver gauntlet gold and removes the pauldron (4 of 4).", "next": "Labelling page with positive questions (C75 traits for the dwarf; gauntlet / pauldron for the elf).", "files": "docs/te_punct_result.md;data/te_punct_plan.csv"}, {"id": "TAP1", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "What each tap carries: replicate and test the public tap probes", "state": "Public work already exists: krea-explorations (single-tap probes, projector reweighting, an 'L20 hub'), the TS Krea2 Text Fusion node (one global projector strength), community projector-bypass files. None is pre-registered or blind.", "next": "First reproduce their main claims on our bench (single-tap renders, per-tap projector gains) with gates and blind labels; then use the taps as knobs only if they behave.", "files": "data/te_tap_isolation_txtfusion_weights.csv"}, {"id": "TAP2", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "Tap transplant: put one tap of prompt B into prompt A", "state": "Causal version of TAP1: swap a single tap (or the early/mid or late group) between two prompts and see which attributes travel. Needs a new 'transplant' variant of the conditioning-push node.", "next": "Design after C79's labels.", "files": "tools/comfyui_krea2_condpush/__init__.py"}, {"id": "TEP2", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "L06 MLP and the massive activations", "state": "The 36-layer probe shows the stream norm jumping from 398 to 13107 at L06's MLP (descriptive, no pre-registration). L06 doubled is also one of the most destructive edits. Link not tested.", "next": "Edit L06 while holding the massive channels at their baseline value, and the reverse; compare with C74's ladder.", "files": "data/te_residual_probe_summary.csv;experiments/te_residual_probe.py"}, {"id": "C80", "area": "Text encoder", "status": "proposed", "priority": "3", "title": "Attribute binding with unnatural object colours (C76 redesigned)", "state": "C76 was withdrawn (natural hues ambiguous). C78 showed plain Krea-2 binds well on simple scenes, so prompts must be hard enough to fail sometimes (pilot rule as in C78).", "next": "Two-object scenes with unnatural colours and swapped twins; base, L06, L14, L28, random push; blind colour assignment.", "files": "docs/prereg_te_bind.md"}, {"id": "C81", "area": "Text encoder", "status": "proposed", "priority": "3", "title": "Text-encoder MLP: down-projection only vs all three matrices", "state": "Doubling gate, up and down multiplies the layer's output by up to about 8 (estimate); scaling only down_proj at matched output norm would separate the gate's non-linearity from plain amplification.", "next": "Pre-register on L06 / L14 / L28 with C75's trait questions.", "files": "results/30-the-text-encoder.md"}, {"id": "C82", "area": "Image model", "status": "proposed", "priority": "3", "title": "Image model: attention output vs MLP output at matched gain", "state": "Page 29: the MLP is the noisier half in 13 of 19 cells. Scaling all matrices gives the MLP a larger effective gain than the attention (QK-norm cancels q and k), so the comparison is confounded.", "next": "Compare attn.wo only vs mlp.down only at equal gain on a few blocks, blind surface labels.", "files": "results/29-inside-the-block.md"}, {"id": "C83", "area": "Image model", "status": "proposed", "priority": "4", "title": "Spectral surgery: scale only the top singular directions of a block", "state": "Idea: separate a directional part from a generic cost inside one matrix. Context numbers in older drafts were not verified.", "next": "Check the random-control results of page 27 and the notebook first; then design.", "files": "results/27-other-edits.md"}, {"id": "C84", "area": "Image model", "status": "proposed", "priority": "3", "title": "Portrait preset applied only in some sampling steps", "state": "Page 28: the preset moves faces more than a change of seed (ArcFace 0.74 vs 0.80) and can flatten an expression.", "next": "Apply the preset only from step 3 on (and only steps 0-2); measure identity and expression blind.", "files": "results/28-portrait-preset.md"}, {"id": "IDEAS", "area": "Backlog", "status": "proposed", "priority": "4", "title": "Older ideas to re-check before any design (C11, C25, C34/C40, C51, C53, C85, Anima)", "state": "These items came from an earlier roadmap draft whose context sentences cited pages and numbers that do not exist in this repository. Keep the questions; rebuild the context from real files before pre-registering.", "next": "Re-read docs/open_work_register.md and pick.", "files": "docs/open_work_register.md"}, {"id": "C77", "area": "Text encoder", "status": "done", "priority": "", "title": "Layer 0 switched off: text in the picture", "state": "Rule 4 of 6: open (attention off writes prompt fragments 4/4, MLP off 2/4, whole layer off 0/4). Readings confirmed by Alessandro. Encoder measure: whole layer off blows the norm up (62x at L05) and loses token identity; half off keeps both.", "next": "Fold into page 30 as an observation (not a holding claim).", "files": "docs/te_layer0_result.md;data/te_layer0_encoder_summary.csv"}, {"id": "C78", "area": "Text encoder", "status": "done", "priority": "", "title": "Punctuation, BREAK and labels on complex prompts", "state": "Commas, periods, semicolons, no punctuation and no labels: no difference (within 0.25 errors). BREAK: worse in 16 of 16 pairs. Encoder: separators change part similarity by under 0.001. Secondary, exploratory: removing labels removes two leaks but turns the totem's catfolk into a cat.", "next": "Fold into page 30.", "files": "docs/prereg_te_punct.md;docs/te_punct_result.md;data/te_punct_tests.csv;data/te_punct_encoder_summary.csv"}, {"id": "C48", "area": "Image model", "status": "done", "priority": "", "title": "Residual-stream write probe over the 28 blocks", "state": "P3 holds (norm grows with depth, +0.99); P1 and P2 refuted (late blocks write the largest fraction; the middle spike is block 10).", "next": "Claims on page 21 wait for approval.", "files": "docs/prereg_residual_probe.md;docs/residual_probe_result.md;data/residual_probe_test.csv"}, {"id": "C66", "area": "Metrics", "status": "done", "priority": "", "title": "Automatic metrics calibrated on the text-encoder renders", "state": "3 of 7 rules validated (VQAScore on lost traits; DINOv2 / CSD on word-order dispersion and on how much changed); 4 not (CSD direction coherence, CSD vs DINOv2 on style, CLIP genre 0.593 against 0.600).", "next": "Claims on page 25 wait for approval.", "files": "docs/prereg_metric_validation.md;docs/metric_validation_result.md;data/metric_val_tests.csv"}, {"id": "TEP", "area": "Text encoder", "status": "done", "priority": "", "title": "36-layer residual probe of the text encoder (descriptive)", "state": "No pre-registration. L06's MLP takes the stream norm from 398 to 13107; layers 7-33 then write 1-8 % of the stream each.", "next": "Use as context for TEP2.", "files": "experiments/te_residual_probe.py;data/te_residual_probe_summary.csv"}, {"id": "C76", "area": "Text encoder", "status": "withdrawn", "priority": "", "title": "Broken links or defaults win (v1)", "state": "Withdrawn before any label: natural hues made off-target colour ambiguous.", "next": "Redesigned as C80.", "files": "docs/prereg_te_bind.md"}], PAGES=[{"page": "20-method.md", "title": "The edit, the instrument, and what a result had to pass", "status": "holds", "renders": 33, "claims": {"holds": 3}}, {"page": "21-block-map.md", "title": "A map of the 28 blocks", "status": "open", "renders": 1606, "claims": {"open": 5, "ambiguous": 1, "holds": 1, "overturned": 1}}, {"page": "22-saturation-knob.md", "title": "One block that turns saturation up and down", "status": "holds", "renders": 128, "claims": {"holds": 2, "open": 1}}, {"page": "23-prompt-family-presets.md", "title": "One preset for a whole family of prompts", "status": "holds", "renders": 433, "claims": {"holds": 1, "open": 3}}, {"page": "24-wording.md", "title": "Does the way a prompt is written change what a block does?", "status": "ambiguous", "renders": 971, "claims": {"ambiguous": 1, "open": 1}}, {"page": "25-standard-metrics.md", "title": "What the standard metrics see, and what they miss", "status": "overturned", "renders": 1619, "claims": {"overturned": 2, "open": 1, "holds": 1}}, {"page": "26-what-did-not-work.md", "title": "What did not work, and the limits of everything else", "status": "overturned", "renders": 295, "claims": {"overturned": 4}}, {"page": "27-other-edits.md", "title": "Appendix A: other kinds of edit", "status": "ambiguous", "renders": 1730, "claims": {"holds": 2, "ambiguous": 1}}, {"page": "28-portrait-preset.md", "title": "A preset made by eye, tested blind on characters it never saw", "status": "holds", "renders": 514, "claims": {"holds": 2, "overturned": 1, "open": 1}}, {"page": "29-inside-the-block.md", "title": "Inside a block — attention, MLP, and what an edit costs", "status": "holds", "renders": 2120, "claims": {"holds": 2, "open": 2, "ambiguous": 1}}, {"page": "30-the-text-encoder.md", "title": "The text encoder — how hard it pushes, and where the picture goes", "status": "holds", "renders": 1649, "claims": {"holds": 12, "overturned": 4, "open": 3, "ambiguous": 3}}], ORDER=["in progress", "waiting for decision", "open", "proposed", "done", "withdrawn"];
const COL={"in progress":"var(--s-in)","waiting for decision":"var(--s-wait)","open":"var(--s-open)","proposed":"var(--s-prop)","done":"var(--s-done)","withdrawn":"var(--s-wd)"};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('pg').innerHTML='<tr><th>page</th><th>title</th><th>status</th><th>renders</th><th>claims</th></tr>'+
 PAGES.map(p=>`<tr><td>${p.page.slice(0,2)}</td><td>${esc(p.title)}</td><td>${esc(p.status)}</td><td>${p.renders}</td><td>${Object.entries(p.claims).map(([k,v])=>k+' '+v).join(', ')}</td></tr>`).join('');
let cur='all',q='';const bar=document.getElementById('bar');
['all',...ORDER].forEach(s=>{const b=document.createElement('button');b.textContent=s+(s==='all'?'':' ('+ITEMS.filter(i=>i.status===s).length+')');b.onclick=()=>{cur=s;draw()};b.dataset.s=s;bar.appendChild(b)});
const inp=document.createElement('input');inp.placeholder='search';inp.oninput=()=>{q=inp.value.toLowerCase();draw()};bar.appendChild(inp);
function draw(){bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===cur));
 const L=ITEMS.filter(i=>(cur==='all'||i.status===cur)&&JSON.stringify(i).toLowerCase().includes(q))
  .sort((a,b)=>ORDER.indexOf(a.status)-ORDER.indexOf(b.status)||(a.priority||9)-(b.priority||9));
 document.getElementById('list').innerHTML=L.map(i=>`<div class="card" style="--c:${COL[i.status]}"><h3>${esc(i.id)} · ${esc(i.title)}</h3>
 <div class="meta">${esc(i.area)} · ${esc(i.status)}${i.priority?' · priority '+i.priority:''}</div>
 <div><span class="lab">State.</span> ${esc(i.state)}</div><div><span class="lab">Next.</span> ${esc(i.next)}</div>
 <div class="meta" style="margin-top:6px">${i.files.split(';').filter(Boolean).map(f=>'<code>'+esc(f)+'</code>').join(' ')}</div></div>`).join('')||'<p>No item.</p>'}
draw();
</script></main></body></html>
