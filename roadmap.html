const ITEMS=[{"id": "C79", "area": "Text encoder", "status": "done", "priority": "1", "title": "12-tap isolation: which taps carry the L06 / L14 damage", "state": "Done: 76/76 renders, 4/4 gates, encoder audit, --analyze, blind labels (kappa 1.00). Rule 1 inconclusive: early_mid loses more traits than late in 5/6 pairs but by +0.146 (threshold +0.15). Rule 2: local taps do nothing (needs accumulation). Rule 3: CSD says late moves style more (21/24). The two halves together fall short of the full edit (L14: about 40%).", "next": "Reading approved 2026-10-18; goes into page 30 with PUB30.", "files": "docs/prereg_te_tap_isolation.md;docs/te_tap_isolation_result.md;docs/directives_antigravity_te_tap_analyze.md;data/te_tap_isolation_encoder_summary.csv;data/te_tap_isolation_txtfusion_weights.csv;experiments/te_tap_isolation_page.py;data/te_tap_key.csv;data/te_tap_schedule.csv;experiments/te_tap_isolation_tally.py;data/te_tap_alessandro.csv;data/te_tap_tests.csv;data/te_tap_by_picture.csv;data/te_tap_isolation_metrics.csv;data/te_tap_isolation_cells.csv;docs/RENDERS_2026-10-17_te_tap_isolation.md", "tool_rule": ""}, {"id": "PUB30", "area": "Publication", "status": "waiting for decision", "priority": "1", "title": "Page 30 and the Story: add C77, C78, the 36-layer probe and C79", "state": "Page 30 and the Story updated 2026-10-18 with C77, C78, the 36-layer probe and C79: six new claims (3 holds, 1 ambiguous, 2 open), figures F30.21-F30.23 built from data; both validations pass with 0 errors.", "next": "Antigravity runs docs/directives_antigravity_publish_results.md.", "files": "results/30-the-text-encoder.md;results/STORY.md;docs/directives_antigravity_publish_results.md;experiments/pub30_page30_edit.py", "tool_rule": ""}, {"id": "APP2125", "area": "Publication", "status": "done", "priority": "1", "title": "Pages 21 and 25: new claims from C48 and C66 (written by Argon, not committed)", "state": "Approved by Alessandro 2026-10-18; committed with Claude wording fixes; notebook rebuilt (0 errors).", "next": "", "files": "results/21-block-map.md;results/25-standard-metrics.md;docs/residual_probe_result.md;docs/metric_validation_result.md", "tool_rule": ""}, {"id": "C78N", "area": "Text encoder", "status": "open", "priority": "2", "title": "C78 natural prompts: blind labels on the dwarf and the elf in five versions", "state": "Seen by eye only: no punctuation turns the dwarf's steel gorget brass (2 of 4 seeds); BREAK turns the elf's silver gauntlet gold and removes the pauldron (4 of 4).", "next": "Labelling page with positive questions (C75 traits for the dwarf; gauntlet / pauldron for the elf).", "files": "docs/te_punct_result.md;data/te_punct_plan.csv", "tool_rule": "Yes (punctuation matters on natural prompts): the tool needs prompt-writing rules. No: only BREAK matters, as on the complex prompts."}, {"id": "TAP1", "area": "Text encoder", "status": "withdrawn", "priority": "2", "title": "What each tap carries: replicate and test the public tap probes", "state": "Merged into C87 on 2026-10-18: the single-tap probes become one arm of C87.", "next": "", "files": "data/te_tap_isolation_txtfusion_weights.csv", "tool_rule": ""}, {"id": "TAP2", "area": "Text encoder", "status": "paused", "priority": "2", "title": "Tap transplant: put one tap of prompt B into prompt A", "state": "Causal version of TAP1: swap a single tap (or the early/mid or late group) between two prompts and see which attributes travel. Needs a new 'transplant' variant of the conditioning-push node.", "next": "Paused 2026-10-18: design only after C87 says which taps carry the effect.", "files": "tools/comfyui_krea2_condpush/__init__.py", "tool_rule": ""}, {"id": "TEP2", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "L06 MLP and the massive activations", "state": "Proposed after the 36-layer probe: L06 MLP takes the stream norm from 398 to 13107; layers 7-33 then write 1-8% each.", "next": "After C87 (Alessandro, 2026-10-18). Encoder side first (no renders): edit L06 holding the massive channels at baseline, and the reverse; renders only if the encoder shows a difference. Pre-register before computing.", "files": "data/te_residual_probe_summary.csv;experiments/te_residual_probe.py", "tool_rule": "Yes (the damage goes through the massive channels): layers that create massive activations are the ones a style tool must leave alone, a rule checkable on any LLM encoder (Anima uses Qwen3 0.6B). No: L06 is destructive for another reason, and \"avoid early MLPs\" stays an empirical map."}, {"id": "C80", "area": "Text encoder", "status": "paused", "priority": "3", "title": "Attribute binding with unnatural object colours (C76 redesigned)", "state": "C76 was withdrawn (natural hues ambiguous). C78 showed plain Krea-2 binds well on simple scenes, so prompts must be hard enough to fail sometimes (pilot rule as in C78).", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Two-object scenes with unnatural colours and swapped twins; base, L06, L14, L28, random push; blind colour assignment.", "files": "docs/prereg_te_bind.md", "tool_rule": ""}, {"id": "C81", "area": "Text encoder", "status": "paused", "priority": "3", "title": "Text-encoder MLP: down-projection only vs all three matrices", "state": "Doubling gate, up and down multiplies the layer's output by up to about 8 (estimate); scaling only down_proj at matched output norm would separate the gate's non-linearity from plain amplification.", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Pre-register on L06 / L14 / L28 with C75's trait questions.", "files": "results/30-the-text-encoder.md", "tool_rule": ""}, {"id": "C82", "area": "Image model", "status": "paused", "priority": "3", "title": "Image model: attention output vs MLP output at matched gain", "state": "Page 29: the MLP is the noisier half in 13 of 19 cells. Scaling all matrices gives the MLP a larger effective gain than the attention (QK-norm cancels q and k), so the comparison is confounded.", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Compare attn.wo only vs mlp.down only at equal gain on a few blocks, blind surface labels.", "files": "results/29-inside-the-block.md", "tool_rule": ""}, {"id": "C83", "area": "Image model", "status": "paused", "priority": "4", "title": "Spectral surgery: scale only the top singular directions of a block", "state": "Idea: separate a directional part from a generic cost inside one matrix. Context numbers in older drafts were not verified.", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Check the random-control results of page 27 and the notebook first; then design.", "files": "results/27-other-edits.md", "tool_rule": ""}, {"id": "C84", "area": "Image model", "status": "paused", "priority": "3", "title": "Portrait preset applied only in some sampling steps", "state": "Page 28: the preset moves faces more than a change of seed (ArcFace 0.74 vs 0.80) and can flatten an expression.", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Apply the preset only from step 3 on (and only steps 0-2); measure identity and expression blind.", "files": "results/28-portrait-preset.md", "tool_rule": ""}, {"id": "IDEAS", "area": "Backlog", "status": "paused", "priority": "4", "title": "Older ideas to re-check before any design (C11, C25, C34/C40, C51, C53, C85, Anima)", "state": "These items came from an earlier roadmap draft whose context sentences cited pages and numbers that do not exist in this repository. Keep the questions; rebuild the context from real files before pre-registering.", "next": "Paused 2026-10-18 (Alessandro): no tool rule or mechanism promised yet. Re-read docs/open_work_register.md and pick.", "files": "docs/open_work_register.md", "tool_rule": ""}, {"id": "C77", "area": "Text encoder", "status": "done", "priority": "", "title": "Layer 0 switched off: text in the picture", "state": "Rule 4 of 6: open (attention off writes prompt fragments 4/4, MLP off 2/4, whole layer off 0/4). Readings confirmed by Alessandro. Encoder measure: whole layer off blows the norm up (62x at L05) and loses token identity; half off keeps both.", "next": "Fold into page 30 as an observation (not a holding claim).", "files": "docs/te_layer0_result.md;data/te_layer0_encoder_summary.csv", "tool_rule": ""}, {"id": "C78", "area": "Text encoder", "status": "done", "priority": "", "title": "Punctuation, BREAK and labels on complex prompts", "state": "Commas, periods, semicolons, no punctuation and no labels: no difference (within 0.25 errors). BREAK: worse in 16 of 16 pairs. Encoder: separators change part similarity by under 0.001. Secondary, exploratory: removing labels removes two leaks but turns the totem's catfolk into a cat.", "next": "Fold into page 30.", "files": "docs/prereg_te_punct.md;docs/te_punct_result.md;data/te_punct_tests.csv;data/te_punct_encoder_summary.csv", "tool_rule": ""}, {"id": "C48", "area": "Image model", "status": "done", "priority": "", "title": "Residual-stream write probe over the 28 blocks", "state": "P3 holds (norm grows with depth, +0.99); P1 and P2 refuted (late blocks write the largest fraction; the middle spike is block 10).", "next": "Claims on page 21 wait for approval.", "files": "docs/prereg_residual_probe.md;docs/residual_probe_result.md;data/residual_probe_test.csv", "tool_rule": ""}, {"id": "C66", "area": "Metrics", "status": "done", "priority": "", "title": "Automatic metrics calibrated on the text-encoder renders", "state": "3 of 7 rules validated (VQAScore on lost traits; DINOv2 / CSD on word-order dispersion and on how much changed); 4 not (CSD direction coherence, CSD vs DINOv2 on style, CLIP genre 0.593 against 0.600).", "next": "Claims on page 25 wait for approval.", "files": "docs/prereg_metric_validation.md;docs/metric_validation_result.md;data/metric_val_tests.csv", "tool_rule": ""}, {"id": "TEP", "area": "Text encoder", "status": "done", "priority": "", "title": "36-layer residual probe of the text encoder (descriptive)", "state": "No pre-registration. L06's MLP takes the stream norm from 398 to 13107; layers 7-33 then write 1-8 % of the stream each.", "next": "Use as context for TEP2.", "files": "experiments/te_residual_probe.py;data/te_residual_probe_summary.csv", "tool_rule": ""}, {"id": "C76", "area": "Text encoder", "status": "withdrawn", "priority": "", "title": "Broken links or defaults win (v1)", "state": "Withdrawn before any label: natural hues made off-target colour ambiguous.", "next": "Redesigned as C80.", "files": "docs/prereg_te_bind.md", "tool_rule": ""}, {"id": "C87", "area": "Text encoder", "status": "in progress", "priority": "1", "title": "How many taps, and which: cumulative tap windows and single taps (absorbs TAP1)", "state": "Pre-registration written 2026-10-18 (docs/prereg_te_tap_windows.md): L06 only, forward windows, backward windows and single taps, 156 renders with 18 bit-exact gates against C79. Primary measure changed from VQAScore to DINOv2: on C79 pictures VQAScore tracks the blind trait loss poorly (Spearman 0.31), DINOv2 well (0.70); a blind control on 36 pictures can invalidate it. Design and 156 renders approved by Alessandro 2026-10-18; plan, script and directive committed before the first render.", "next": "Antigravity runs docs/directives_antigravity_te_tap_windows.md (gate 18 renders, main 138, --analyze); then Claude re-checks the gates and builds the blind control page (36 pictures).", "files": "docs/prereg_te_tap_windows.md;docs/te_tap_isolation_result.md;data/te_tap_isolation_txtfusion_weights.csv;experiments/te_tap_windows.py;data/te_tap_windows_plan.csv;docs/directives_antigravity_te_tap_windows.md", "tool_rule": "Yes (the effect rises at a few taps): those taps are a knob. No (it needs all taps): rule \"do not edit the text encoder for style\"."}, {"id": "C86", "area": "Text encoder", "status": "proposed", "priority": "4", "title": "Text encoder vs image model at matched effect", "state": "Page 30 holds that TE edits cost less surface than the DiT preset (BRISQUE, CLIP-IQA, not validated in C66), but they change genre, identity and traits; the two were never compared at equal change.", "next": "Pre-register: TE and DiT edits matched in DINOv2 distance (validated in C66); blind traits, identity and surface.", "files": "results/30-the-text-encoder.md;docs/metric_validation_result.md", "tool_rule": "Decides which half the style tool is built on: the one that keeps more traits and identity at equal change."}, {"id": "ANIMA2", "area": "Transfer", "status": "proposed", "priority": "5", "title": "Anima: do the claims found after stage 1 hold on a cross-attention DiT?", "state": "Anima stage 1 (2026-09-19): the transposed preset separates from randsign (crosshatch, contour length, Holm-corrected). Krea-3 is closed weights (released 2026-10-15, app and API only), so Anima is the open target.", "next": "Inventory of the page claims marked \"holds\" since stage 1 (blk23 saturation knob, portrait preset, block map, TE layer 0) and, for each, what the same test means on Anima; then one pre-registration per claim.", "files": "docs/anima_stage1_results.md;docs/anima_stage1_revisione.md", "tool_rule": "Claims that survive become rules about diffusion models, valid beyond Krea-2; claims that fail are documented as Krea-2 specific."}, {"id": "LIT1", "area": "Text encoder", "status": "proposed", "priority": "4", "title": "Literature on Krea-2: does the text encoder keep knowledge in one place, as CLIP does in SD 1.x?", "state": "Basu et al. 2023 (README ref. 31): in SD 1.x the CLIP text encoder holds styles, objects and facts in its first self-attention layer at the last subject token; Basu et al. 2024 (ref. 20): not found in SD-XL or DeepFloyd. Our C77: Qwen3-VL first-layer attention off writes the prompt as text. Diffusion Lens (ref. 21) and ReFACT/TIME (ref. 30) are covered by C87 and C86.", "next": "Pre-register a causal-tracing replication on Qwen3-VL-4B: corrupt the subject tokens, restore one layer (attention or MLP) at a time, measure with DINOv2 and blind labels whether the character comes back; first on the encoder side, renders only for the layers that restore.", "files": "results/README.md;docs/te_layer0_result.md", "tool_rule": "Yes (knowledge in one layer, as in SD 1.x CLIP): targeted closed-form edits of that layer become a precise tool for content. No (spread, as in SD-XL): text-encoder edits stay coarse, and style tools belong in the image model."}, {"id": "C88", "area": "Text encoder", "status": "waiting for decision", "priority": "2", "title": "Predict where an edit goes from its push on the conditioning (no renders)", "state": "Run 2026-10-18: inconclusive. PUSH 0.587 = EDIT 0.583 (MAJ 0.472); the nearest push is the same edit on another prompt in 252 of 252 cases: the mean push is a fingerprint of the edit, almost prompt-independent, so it cannot carry the prompt's deviation. Hypothesis not refuted, untestable with this feature.", "next": "Alessandro reads docs/te_predict_destination_result.md; follow-up C92.", "files": "docs/prereg_te_predict_destination.md;experiments/te_predict_destination.py;docs/te_predict_destination_result.md;data/te_predict_tests.csv;data/te_predict_cases.csv", "tool_rule": "Yes: the push, computable without rendering, previews where an edit takes a prompt. No (edit decides): a per-edit destination is enough and prompt deviations are noise."}, {"id": "C89", "area": "Text encoder", "status": "waiting for decision", "priority": "2", "title": "Does the push keep its direction as the dose grows? (no renders; the \"spiral\" question)", "state": "Run 2026-10-18: in between. Linear at small doses (sign symmetry 0.977); strong pushes turn about 50 degrees from 0.10 to 1.00 (median c 0.665), not in clean arcs (2 of 20); L06 0.46, L14 0.48, L28 0.71; bend vs eye intensity Spearman +0.57 (lead).", "next": "Alessandro reads docs/te_trajectories_result.md. Follow-up without renders: encodes at C74's twelve doses, per token (GPU, Antigravity).", "files": "docs/prereg_te_trajectories.md;experiments/te_trajectories.py;docs/te_trajectories_result.md;data/te_trajectories.csv;data/te_trajectories_tests.csv", "tool_rule": "Straight: a knob is calibrated by size alone. Curved arcs: each dose also picks a direction, so a knob needs a map, and the spiral reading earns a dedicated test."}, {"id": "C90", "area": "Text encoder", "status": "proposed", "priority": "4", "title": "Sparse autoencoders on the text-encoder taps: single concepts instead of whole layers", "state": "Proposed 2026-10-18. Superposition (Elhage et al. 2022) would make whole-layer edits look random; SAEs on SDXL (README ref. 2) found specialised features.", "next": "Check for existing SAEs on Qwen3-VL-4B or Qwen3-4B; otherwise train on tap activations of a prompt corpus (GPU, no renders); then steer single features and test blind.", "files": "results/README.md", "tool_rule": "If single features move style or traits cleanly, they are the knobs (finer than a layer). If not, the text encoder stays coarse at the feature level too."}, {"id": "C91", "area": "Image model", "status": "proposed", "priority": "6", "title": "LoRA weight deltas: shared directions in style LoRAs vs character LoRAs (last resort)", "state": "Proposed 2026-10-18 by Alessandro, to run only if C87-C90, TEP2 and LIT1 find no usable structure. Precedent: weights2weights (README ref. 7). Most community LoRAs touch only the image model.", "next": "Count the Krea-2 LoRAs available per category (style, character); if at least ~10 each, compare their per-layer deltas (subspace angles).", "files": "results/README.md", "tool_rule": "If style LoRAs share a subspace in specific blocks, that subspace is a style knob; if not, styles are learned in idiosyncratic directions."}, {"id": "C92", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "Predict the destination from the edit and the prompt's own priors (no renders)", "state": "Proposed 2026-10-18 after C88: the mean push is the same on every prompt, so the prompt-specific part of the destination must come from what the push meets.", "next": "Pre-register: predict the genre from the edit plus the prompt's fallback without style words (C73) and its phrase priors (C72), leave one prompt out, against EDIT alone.", "files": "docs/te_predict_destination_result.md;data/te_fallback_tests.csv", "tool_rule": "Yes: a tool can warn, per prompt, where an edit will land by looking at the prompt's own fallback. No: destinations stay per edit."}, {"id": "C93", "area": "Text encoder", "status": "proposed", "priority": "2", "title": "Shapes of the push along the dose: spiral, wave, clip (wrap-around), accelerating; whole encoder or per tap (no renders)", "state": "Proposed 2026-10-18 by Alessandro after C89 (three doses cannot tell shapes apart; C89 hints: detours compatible with a wave, L02 MLP zeroed already past 90 degrees, C74 onset at 0.70 compatible with acceleration).", "next": "Pre-register four rules on the unit direction of the push, projected on its first two principal components: spiral (planar, one rotation sense, total turn > 90 deg), wave (rotation sense reverses at least twice), clip (direction past the opposite, cos with the start <= -0.5), accelerating (most of the turn in the last third of the path, measured per unit of push length, not of dose). About 20 doses per sign up to 3.0; L06, L14, L28 MLP, two attention halves; three characters; per tap and per token; random pushes of the same size injected at the same layer as control (a shape the random pushes share belongs to the network, not to the concepts). Encoder only, GPU, after C87.", "files": "docs/te_trajectories_result.md;data/te_trajectories.csv", "tool_rule": "Straight or one plane: a knob is calibrated by push length. A shape the random controls do not share: the concepts are organised along it, and a knob must follow the curve. Clip: past some dose the knob reverses, so it needs an upper bound."}, {"id": "C94", "area": "Text encoder", "status": "proposed", "priority": "3", "title": "Is the style switch a phase transition? Critical dose, seed fluctuations, mixed pictures", "state": "Proposed 2026-10-18 (Alessandro, from the Biham-Middleton-Levine traffic model: one simple rule, a sharp jam at a critical density, a narrow band of mixed states). C74: no style change below 0.70, L06 jumps around 0.80 in 4 of 5 strips, L14 slides; the elf rogue passes through a painted look. Language in the literature for sampling time: symmetry breaking (Raya and Ambrogioni 2023), speciation (Biroli et al. 2024).", "next": "Pre-register: L06 (step) and L14 (slide) at doses 0.60-0.90 in steps of 0.025, 3 characters x 8 seeds (312 renders per edit). Primary signature: the variance across seeds of the DINOv2 distance peaks inside the band and not at its edges. Then: width of the jump, blind labels of mixed pictures, critical dose per prompt, and when the picture commits during the 9 sampling steps. Renders need Alessandro's approval.", "files": "docs/te_trajectories_result.md;results/30-the-text-encoder.md", "tool_rule": "Transition: near the critical dose the knob is unstable and seed-dependent; calibrate outside the band, or use the band on purpose for hybrids. No transition: the dose is a smooth slider."}, {"id": "C95", "area": "Text encoder", "status": "proposed", "priority": "3", "title": "Map the basins: 2D slices of the conditioning around a picture on a watershed", "state": "Proposed 2026-10-18. Page 22: the half-formed hood (1 seed in 32) tips with 58 of 69 edits, from dose 0.02; block 10 positive lowers it at 0.04 and completes it at 0.16, crossing the boundary twice. Precedent for complex boundaries in networks: Sohl-Dickstein 2024 (trainability boundary is fractal).", "next": "Find 3-4 pictures on a watershed; for each, a 9x9 grid over two conditioning directions (edit direction x random direction) with Krea2ConditioningPush, 81 renders per map; colour cells by outcome; measure boundary shape and fragility (share of small random pushes that tip it). Renders need approval.", "files": "results/22-saturation-knob.md;docs/hood_threshold_result.md", "tool_rule": "A fragility map tells where a knob is reliable (inside a basin) and where it is a lottery (near a boundary); a prompt can be scored for how close to a boundary it sits before editing."}, {"id": "C96", "area": "Image model", "status": "waiting for decision", "priority": "2", "title": "Micro-watersheds: do minimal edits flip the same small regions of a picture? (no renders)", "state": "Run 2026-10-18 (Alessandro: every picture holds details balanced between two solutions). T1 flips carry the change in 26/26; T2 the same places flip, texture removed, median 0.506 (bar 0.30), across blocks and signs; T3 bimodal 217/258 (weak statistic). One bf16 step on block 27 makes the arrow fletching appear. Part of the flips are moved edges.", "next": "Alessandro reads docs/micro_watersheds_result.md. Follow-up C97 (renders).", "files": "docs/prereg_micro_watersheds.md;experiments/micro_watersheds.py;docs/micro_watersheds_result.md;data/micro_watersheds_tests.csv", "tool_rule": "The same places flip: a few tiny edits reveal a picture's fragile places, and a tool can separate intended changes from incidental reshuffling."}, {"id": "C97", "area": "Image model", "status": "in progress", "priority": "1", "title": "Fragile places: replication on 2 prompts x 6 seeds; starting noise or content; do tiny prompt changes hit the same places?", "state": "Pre-registered and approved 2026-10-18 (108 renders: base, 5 weight micro-edits, 3 prompt micro-changes per prompt and seed; initial noise saved). Related work: De Vita and Belagiannis 2024 (pixel instability under re-noising), Sclocchi et al. 2025 (phase transition, hierarchy), critical windows (Li and Chen 2024). The C96 fletching is an object the prompt asks for.
